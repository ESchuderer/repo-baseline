name: Pages

# Copy to .github/workflows/pages.yml (README, Release and Pages). One workflow builds both editions into one artifact,
# because a Pages deployment replaces the whole site: the root is the latest release, built from its tag, and /next/ is
# main. Until the first release exists the root redirects to /next/.
# Variant for a site built with mkdocs: requirements-docs.txt is hash-locked (README, lint-python) and `site_url` in
# mkdocs.yml reads SITE_URL (`site_url: !ENV SITE_URL`). A documentation site keeps no data in the browser, so the
# editions need no storage names. For a custom domain or a user site, drop the repository name from SITE_URL.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag=$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --json tagName,isLatest \
            --jq '.[] | select(.isLatest) | .tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.latest.outputs.tag != '' }}
        with:
          ref: ${{ steps.latest.outputs.tag }}
          path: stable
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install mkdocs
        run: |
          python -m pip install --only-binary :all: --require-hashes -r next/requirements-docs.txt
      - name: Build main
        working-directory: next
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/next/
        run: mkdocs build --site-dir dist
      - name: Build latest release
        if: ${{ steps.latest.outputs.tag != '' }}
        working-directory: stable
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: mkdocs build --site-dir dist
      - name: Assemble site
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          mkdir -p _site/next
          cp -R next/dist/. _site/next/
          if [ -n "$TAG" ]; then
            cp -R stable/dist/. _site/
          else
            echo '<!doctype html><meta http-equiv="refresh" content="0; url=next/">' > _site/index.html
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
