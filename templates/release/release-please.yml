name: Release

# Copy to .github/workflows/release.yml (README, Release and Pages). release-please keeps one release pull request open
# from the Conventional Commits on main. Merging it tags the version and creates the GitHub Release. The weekly
# workflow (callers/release-weekly.yml) merges it every Monday; the owner can merge it earlier or run that workflow by hand.
#
# The pull request opens with the release GitHub App token so that its required checks run without approval (a pull
# request opened with GITHUB_TOKEN starts no runs until someone approves them). Set the variable RELEASE_APP_CLIENT_ID
# and the secret RELEASE_APP_PRIVATE_KEY. Without them the job falls back to GITHUB_TOKEN: the owner then approves the
# runs on the release pull request and starts the Pages workflow by hand after a release, because a release created
# with GITHUB_TOKEN does not trigger `release: published`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # simple: version in version.txt and CHANGELOG.md; use node, python and so on to bump a manifest as well.
          release-type: simple
