# Merge into the repository's pyproject.toml. Keep `max-complexity` and the pylint limits in step with the README.

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "B", "C4", "C90", "SIM", "RET", "PTH", "PERF", "RUF", "UP", "I", "PT", "ARG",
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLE", "PLW", "PLC",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-returns = 6
max-branches = 12
max-statements = 50

# Relaxed per path. Adapt the globs: tests use fixtures and long setups; CAD scripts are long linear build steps
# with many parameters, so size and complexity limits and unused-argument checks do not fit them.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "C901", "PLR0912", "PLR0913", "PLR0915", "PLC0415"]
"**/cad/**" = ["ARG", "C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.basedpyright]
# "standard" is the type checker of Pyright. "recommended" adds the Unknown* and missing-annotation reports.
typeCheckingMode = "standard"
# Folders to check; the baseline lives in .basedpyright/baseline.json (create it with `basedpyright --writebaseline`).
include = ["src", "tests"]
