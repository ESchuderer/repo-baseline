# Copy to the repository root. Replace every value in angle brackets.
sonar.organization=<SonarQube Cloud organization key>
sonar.projectKey=<organization key>_<repository name>
sonar.sourceEncoding=UTF-8

# Folders to analyze and the test files among them.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,docs/**
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/test/**,**/tests/**,**/e2e/**

# Coverage reports the CI job writes before the scan (delete the line of the language you do not use).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
