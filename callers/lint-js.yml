name: Lint JS
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # `--ignore-scripts` keeps SonarQube rule S6505 quiet; drop it if a dependency needs its install script (README, lint-js)
      - run: npm ci --ignore-scripts
      # `check` runs the repository's own scripts (lint, typecheck, knip, dup); the tools come from package.json
      - run: npm run check
