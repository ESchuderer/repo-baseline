name: Sonar

# Reusable: one SonarQube Cloud scan with SonarSource/sonarqube-scan-action. It scans pushes to `branch` and pull
# requests into `branch`, and nothing else, so a pull request into another branch is never scanned even when the
# caller triggers on every pull request. Fork pull requests are skipped: GitHub gives them no secret.
# Dependabot pull requests are skipped too: they get no Actions secret, and a version bump has no code of the
# repository to analyze, so the token needs no copy in the Dependabot secrets.
# Put the job in the same workflow as the tests when the scan imports their coverage (`coverage-artifact`).
on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: main
      coverage-artifact:
        type: string
        default: ''
        description: Name of an artifact of the same workflow run; its files are extracted into the project directory before the scan.
      project-base-dir:
        type: string
        default: .
    secrets:
      SONAR_TOKEN:
        required: true

permissions: {}

jobs:
  sonar:
    if: >-
      (github.event_name == 'push' && github.ref_name == inputs.branch)
      || (github.event_name == 'pull_request' && github.base_ref == inputs.branch
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the scan needs the whole history to find the new code and the blame
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.coverage-artifact != '' }}
        with:
          name: ${{ inputs.coverage-artifact }}
          path: ${{ inputs.project-base-dir }}
      - name: Check the token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is empty. Add it as a repository secret."
            exit 1
          fi
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.project-base-dir }}
