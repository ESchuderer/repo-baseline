name: Promote

# Reusable: keeps one open pull request from the source branch to the release branch, listing the commits the
# release branch lacks. Merging it (merge commit) is the release decision. GITHUB_TOKEN opens it, so its
# pull_request runs wait for approval by someone with write access: the release branch should only require checks
# that also run on pushes to the source branch, whose results already sit on the pull request's head commit.
on:
  workflow_call:
    inputs:
      source:
        type: string
        default: develop
      target:
        type: string
        default: main

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: promote-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: ${{ inputs.source }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Open or update the promotion pull request
        run: |
          set -eu
          compare="repos/$GH_REPO/compare/$TARGET...$SOURCE"
          ahead=$(gh api "$compare" --jq .ahead_by)
          if [ "$ahead" -eq 0 ]; then echo "$TARGET has every commit of $SOURCE"; exit 0; fi
          body="$RUNNER_TEMP/body.md"
          {
            echo "Commits on \`$SOURCE\` that \`$TARGET\` lacks: $ahead (the compare API lists at most 250)."
            echo
            gh api "$compare" --jq '.commits[] | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"'
            echo
            echo "Merge with a merge commit to release. Opened and updated by the promote workflow of ESchuderer/repo-baseline."
          } > "$body"
          pr=$(gh pr list --head "$SOURCE" --base "$TARGET" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$body"
          else
            gh pr create --head "$SOURCE" --base "$TARGET" --title "chore: promote $SOURCE to $TARGET" --body-file "$body"
          fi
