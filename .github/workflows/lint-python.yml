name: Lint Python

# Reusable: ruff and basedpyright. The rules live in the repository's pyproject.toml (templates/lint-python) and the
# basedpyright baseline in .basedpyright/baseline.json. Each tool is pinned here, not in the repository.
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      python-version:
        type: string
        default: '3.13'
      install-command:
        type: string
        default: ''
        description: Installs the project's dependencies so basedpyright resolves imports, for example `pip install -r requirements.txt`.
      ruff:
        type: boolean
        default: true
      basedpyright:
        type: boolean
        default: true
      ruff-version:
        type: string
        default: 0.17.1
      basedpyright-version:
        type: string
        default: 1.40.2

permissions: {}

jobs:
  lint-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install the tools and the dependencies
        env:
          INSTALL: ${{ inputs.install-command }}
          RUFF: ${{ inputs.ruff-version }}
          BASEDPYRIGHT: ${{ inputs.basedpyright-version }}
        run: |
          pip install "ruff==$RUFF" "basedpyright==$BASEDPYRIGHT"
          if [ -n "$INSTALL" ]; then eval "$INSTALL"; fi
      - name: ruff
        if: ${{ inputs.ruff }}
        run: ruff check .
      - name: basedpyright
        if: ${{ inputs.basedpyright }}
        run: basedpyright
