name: Lint JS

# Reusable: Biome lint (complexity, parameters, function length, import cycles), knip, jscpd with a clone baseline and
# an optional TypeScript command. The rules live in the repository's own config files (templates/lint-js). Each tool
# is pinned here, not in the repository: keep biome-version equal to the `$schema` version of biome.json.
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      node-version-file:
        type: string
        default: .nvmrc
      node-version:
        type: string
        default: ''
        description: Overrides node-version-file when set.
      install-command:
        type: string
        default: npm ci
      biome:
        type: boolean
        default: true
      knip:
        type: boolean
        default: true
      jscpd:
        type: boolean
        default: true
      typecheck-command:
        type: string
        default: ''
        description: Run as is, for example `sh scripts/tsc-baseline.sh tsconfig.strict.json tsc-baseline.txt`.
      biome-version:
        type: string
        default: 2.5.15
      knip-version:
        type: string
        default: 6.41.0
      jscpd-version:
        type: string
        default: 5.4.1

permissions: {}

jobs:
  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
      - name: Install dependencies
        env:
          INSTALL: ${{ inputs.install-command }}
        run: eval "$INSTALL"
      - name: Biome lint
        if: ${{ inputs.biome }}
        env:
          VERSION: ${{ inputs.biome-version }}
        run: npx --yes "@biomejs/biome@$VERSION" lint
      - name: knip
        if: ${{ inputs.knip }}
        env:
          VERSION: ${{ inputs.knip-version }}
        run: npx --yes "knip@$VERSION"
      - name: jscpd
        if: ${{ inputs.jscpd }}
        env:
          VERSION: ${{ inputs.jscpd-version }}
        run: |
          if [ -f .jscpd-baseline.json ]; then
            npx --yes "jscpd@$VERSION" --baseline .jscpd-baseline.json --fail-on-new-clones
          else
            npx --yes "jscpd@$VERSION"
          fi
      - name: TypeScript
        if: ${{ inputs.typecheck-command != '' }}
        env:
          COMMAND: ${{ inputs.typecheck-command }}
        run: eval "$COMMAND"
